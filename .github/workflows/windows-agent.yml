name: Windows agent installer
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "server/**"
      - "shared/**"
      - "tests/agent/workspace.test.mjs"
      - "tests/agent-integration.mjs"
      - "public/workdk-agent.zip"
      - "tests/windows-install.mjs"
      - ".github/workflows/windows-agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - "server/**"
      - "shared/**"
      - "tests/agent/workspace.test.mjs"
      - "tests/agent-integration.mjs"
      - "public/workdk-agent.zip"
      - "tests/windows-install.mjs"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test packaged installer and generated hooks on Windows
        shell: pwsh
        run: |
          node --version
          $destination = Join-Path $env:RUNNER_TEMP 'workdk-download-test'
          Expand-Archive -LiteralPath '.\public\workdk-agent.zip' -DestinationPath $destination -Force
          $agentDir = Join-Path $destination 'workdk-agent'
          node tests/windows-install.mjs --agent-dir $agentDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WORKDK_TEST_AGENT_DIR = $agentDir
          node --test tests/agent/mcp.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test snapshot API and collector-to-server flow on Windows
        shell: pwsh
        run: |
          node --test tests/agent/workspace.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/agent-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
